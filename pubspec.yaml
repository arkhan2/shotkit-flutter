name: shotkit
description: ShotKit mobile companion — App Store and Google Play screenshot studio.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  supabase_flutter: ^2.10.3
  google_sign_in: ^6.3.0
  flutter_dotenv: ^6.0.0
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  image_picker: ^1.2.0
  uuid: ^4.5.1
  archive: ^4.0.7
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  gal: ^2.3.2
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  collection: ^1.19.1
  image: ^4.5.4
  path: ^1.9.1
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/config/
